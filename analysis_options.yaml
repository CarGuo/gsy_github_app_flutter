include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    mixin_inherits_from_not_object: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  plugins:
    - custom_lint

linter:
  rules:
    non_constant_identifier_names: false
    file_names: false
    constant_identifier_names: false
    library_private_types_in_public_api: false
    library_prefixes: false
    # Dart 3.13 primary constructor 配套 lint。
    # 之所以现在加：analyzer 已升到 13.3.0，primary constructor 语言级 stable，
    # 这些 lint 会在**后续有人写 primary constructor 时**帮忙提示常见规范
    # （比如空 body 用 `;`、别在 primary constructor 里初始化能挪到字段声明的值等），
    # 而不是逐行推老代码去迁移——这符合 AGENTS.md 说的"改动尽量限制在当前功能域"。
    empty_container_bodies: true
    initialize_in_field_declaration: true
    unnecessary_const_in_enum_constructor: true
    unnecessary_primary_constructor_body: true
    # use_declaring_parameters 是 primary constructor 引入的 declaring parameter 提示，
    # 只对 primary constructor 里的形参生效，不会误伤老代码。
    use_declaring_parameters: true
    # 2026-09-02 补齐官方 6 个 primary constructor 配套 lint 的最后一个。
    # 之前跳过是为了 phase 1 收敛噪音，现在用户明确要求把 6 个 lint 都开出来看 hit。
    unnecessary_type_name_in_constructor: true