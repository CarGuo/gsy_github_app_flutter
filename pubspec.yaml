name: gsy_github_app_flutter
description: Github Application
publish_to: none
version: 1.7.0+32

environment:
  sdk: '>=3.13.0 <4.0.0'

dependency_overrides:
  web_socket_channel: ^3.0.1
  test_api: 0.7.7
  matcher: 0.12.17
  # path_provider_foundation 2.6.0 起改走纯 FFI（objective_c），podspec + Package.swift 双双移除，
  # iOS/macOS 端不再需要 plugin channel。pub 求解不会自动挑到 2.6.0，只能显式 override。
  # 目的：去掉一个 SPM 名单里的 iOS plugin，减少 CocoaPods 变只读前的原生插件面。
  path_provider_foundation: 2.6.0



#dependency_overrides:
#analyzer: 1.1.0
#web_socket_channel: 2.0.0
#pub_semver: 1.4.2
#glob: 2.0.0
#crypto: 3.0.0
#args: 1.0.0
#string_scanner: 1.1.0
#convert: 1.0.0
#rxdart: 0.25.0
#http: 0.13.0
#gql_http_link: 0.3.2
#http_parser: 4.0.0
# fix inappwebview R8 issue https://github.com/pichillilorenzo/flutter_inappwebview/issues/2193
#  flutter_inappwebview_android:
#    git:
#      url: https://github.com/holzgeist/flutter_inappwebview
#      path: flutter_inappwebview_android
#      ref: d89b1d32638b49dfc58c4b7c84153be0c269d057

dependencies:
  flutter:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.4
  fluttertoast: 10.0.0
  share_plus: 13.3.0
  flutter_spinkit: 5.2.1
  sqflite: 2.4.3
  pub_semver: 2.2.1
  flutter_svg: 2.3.0
  flutter_slidable: 3.1.2
  dio: 5.11.0
  #fconsole: 2.2.1
  path_provider: 2.1.6
  webview_flutter: 4.14.1
  # webview_flutter 4.11+ 与 flutter_inappwebview 6.2 在同一进程内共存的兼容性历史上有过
  # WKWebView / Android WebView 争夺 issue（详见 pubspec 历史注释）。本轮 2026-09-03 升到
  # 4.14.1 需要真机冒烟走一遍 GSY WebView 登录页 + inappwebview markdown 图片渲染路径复核；
  # 若发现回归再回退到 4.10.0。
  flutter_inappwebview: 6.2.0-beta.3
  #bezier: ^1.1.5
  flare_flutter:
    git:
      url: https://gitee.com/CarGuo/Flare-Flutter.git
      ref: d9c4ca55cbea3f283491679847ff1e9b4bc74192
      path: flare_flutter/

  rive: 0.14.11
  # 固定版本
  easy_refresh: 3.4.0
  signals: 6.3.0
  flutter_redux: 0.10.0
  rxdart: 0.28.0
  # rxdart 0.27.1 → 0.28.0 有 breaking：`Notification` → `StreamNotification`、
  # `ForkJoinStream.combine2..9` → `join2..9`、`Rx.using` 参数改 named required。
  # 项目实际只用 MergeStream / switchMap / debounce / TimerStream，均未触发这些
  # breaking，升级只吃到 switchMap 内部订阅取消更严格 + Dart 3 SDK 兼容。
  graphql: 5.2.2
  #flutter_cache_manager: 3.0.0-nullsafety.0
  provider: 6.1.5+1
  permission_handler: 11.3.1
  json_annotation: 4.12.0
  package_info_plus: 10.2.1
  connectivity_plus: 7.3.1
  # flutter_markdown 已停止维护，使用 flutter_markdown_plus 替代
  flutter_markdown_plus: 1.0.6
  # 显式声明 markdown 依赖：SafePreBuilder 的 `visitText(md.Text, ...)` 覆盖签名
  # 需要引 `package:markdown/markdown.dart`，避免 depend_on_referenced_packages lint
  markdown: ^7.3.0
  # Dart 官方 HTML 解析器，用于把 GitHub 评论 body 里内嵌的 HTML 白名单标签
  # 前置转成 Markdown 等价语法（flutter_markdown_plus 本身不支持 inline HTML）
  html: 0.15.5
  device_info_plus: 13.2.0
  url_launcher: 6.3.2
  google_fonts: 6.2.1
  android_intent_plus: 5.1.0
  shared_preferences: 2.5.5
  built_value: 8.12.6
  simple_animations: 5.2.0
  supercharged: 2.1.1
  animations: 2.1.1
  lottie: 3.3.2
  auto_size_text: 3.0.0
  flutter_localizations:
    sdk: flutter
  photo_view: 0.15.0
  #    git:
  #      url: https://github.com/CarSmallGuo/photo_view.git
  #      ref: master

  redux: any
  webview_flutter_android: any
  webview_flutter_wkwebview: any
  string_scanner: any
  meta: any
  flutter_riverpod: 3.4.2
  riverpod_annotation: 4.0.6
  # error handle
  talker_flutter: 5.1.20
  talker_dio_logger: 5.1.20

dev_dependencies:
  riverpod_generator: 4.0.8
  built_value_generator: 8.13.0
  build_runner: ^2.4.14
  json_serializable: 6.14.1
  flutter_lints: 5.0.0
  patrol: ^4.7.0
  flutter_test:
    sdk: flutter

patrol:
  app_name: GSYGithubApp
  test_directory: patrol_test
  android:
    package_name: com.shuyu.gsygithub.gsygithubappflutter
  ios:
    bundle_id: com.shuyu.GSYGithubAppBundle


# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # Swift Package Manager 项目级开关（Flutter 官方推荐位置）。
  # 官方从 3.44 起默认启用；显式写入是为了保证所有 contributor 一致，
  # 也避免哪天全局开关被 --no-enable-swift-package-manager 关掉后本项目跟着掉。
  # CocoaPods registry 将于 2026-12-02 变只读，本项目必须走 SPM 主路径。
  config:
    enable-swift-package-manager: true

  # 针对多语言 l10n
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.io/custom-fonts/#from-packages

  assets:
    - static/images/
    - static/file/

  fonts:
    - family: wxcIconFont
      fonts:
        - asset: static/font/iconfont.ttf
    - family: google_kavivanar
      fonts:
        - asset: static/font/google_kavivanar.ttf
    - family: Akronim
      fonts:
        - asset: static/font/akronim.ttf
