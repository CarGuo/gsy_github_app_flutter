name: flutter_performance_monitor
description: Bounded, performance-only Flutter telemetry with passive frame attribution and a durable OTLP outbox.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.carguo.flutter_performance_monitor
        pluginClass: FlutterPerformanceMonitorPlugin
      ios:
        pluginClass: FlutterPerformanceMonitorPlugin
      macos:
        pluginClass: FlutterPerformanceMonitorPlugin
